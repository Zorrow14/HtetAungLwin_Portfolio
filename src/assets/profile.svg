<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Glowing effects -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Background gradients -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121224" />
      <stop offset="100%" stop-color="#05050a" />
    </radialGradient>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#bc13fe" />
    </linearGradient>
    <!-- Hexagon pattern -->
    <pattern id="hex-grid" width="24" height="41.568" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M12 0 L24 6.928 L24 20.784 L12 27.712 L0 20.784 L0 6.928 Z" fill="none" stroke="#1f1f38" stroke-width="1" />
      <path d="M12 41.568 L24 34.64 L24 20.784 L12 27.712 L0 20.784 L0 34.64 Z" fill="none" stroke="#1f1f38" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Dark tech background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="40" />
  
  <!-- Hexagon grid overlay -->
  <rect width="100%" height="100%" fill="url(#hex-grid)" rx="40" />
  
  <!-- Decorative circular interface elements -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.2" />
  <circle cx="200" cy="200" r="145" fill="none" stroke="#bc13fe" stroke-width="1.5" stroke-dasharray="10 15" stroke-opacity="0.4" />
  <circle cx="200" cy="200" r="120" fill="none" stroke="#00f3ff" stroke-width="2" stroke-dasharray="100 40 20 40" filter="url(#glow-cyan)" stroke-opacity="0.8" />
  <circle cx="200" cy="200" r="100" fill="none" stroke="#bc13fe" stroke-width="1" stroke-dasharray="5 5" stroke-opacity="0.6" />

  <!-- Abstract stylized developer icon -->
  <!-- Outer glowing hexagon -->
  <polygon points="200,110 278,155 278,245 200,290 122,245 122,155" fill="none" stroke="url(#neon-grad)" stroke-width="3" filter="url(#glow-purple)" />
  
  <!-- Cyber glasses / HUD elements -->
  <path d="M140 190 L175 190 L185 200 L215 200 L225 190 L260 190" fill="none" stroke="#00f3ff" stroke-width="3" filter="url(#glow-cyan)" />
  <circle cx="160" cy="205" r="12" fill="rgba(0, 243, 255, 0.15)" stroke="#00f3ff" stroke-width="2" />
  <circle cx="240" cy="205" r="12" fill="rgba(0, 243, 255, 0.15)" stroke="#00f3ff" stroke-width="2" />
  
  <!-- Sleek cybernetic neck and face guide -->
  <path d="M200 160 Q200 240 200 240" fill="none" stroke="#bc13fe" stroke-width="1" stroke-dasharray="3 3" />
  <path d="M165 240 L185 255 L215 255 L235 240" fill="none" stroke="url(#neon-grad)" stroke-width="2" />
  
  <!-- Cyber-grid initials "HAL" -->
  <text x="200" y="275" font-family="'Space Grotesk', 'Courier New', monospace" font-size="22" font-weight="900" fill="#00f3ff" text-anchor="middle" letter-spacing="4" filter="url(#glow-cyan)">
    HAL
  </text>
  
  <!-- Floating tech metrics -->
  <text x="75" y="70" font-family="monospace" font-size="10" fill="#94a3b8" opacity="0.6">SYS.ACTIVE // 99.8%</text>
  <text x="325" y="70" font-family="monospace" font-size="10" fill="#00f3ff" opacity="0.8" text-anchor="end">LOC.KL_MYS</text>
  <text x="75" y="340" font-family="monospace" font-size="10" fill="#bc13fe" opacity="0.6">PORT_NODE.01</text>
  <text x="325" y="340" font-family="monospace" font-size="10" fill="#94a3b8" opacity="0.6" text-anchor="end">SW_ENG.DIP</text>
</svg>
